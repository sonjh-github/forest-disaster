name: 백엔드 배포

on:
  push:
    branches: [main]
    paths:
      - "forest-back-demo/**"
      - ".github/workflows/deploy-back-railway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forest-back-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Railway 프로덕션 배포
    runs-on: ubuntu-latest
    environment: back-production
    defaults:
      run:
        working-directory: forest-back-demo
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: forest-back-demo/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 검사
        run: npm test

      - name: Railway 배포
        run: npx @railway/cli@5.30.1 up --service "${{ secrets.RAILWAY_BACK_SERVICE }}" --environment production --ci --path-as-root
