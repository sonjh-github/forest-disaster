name: 통합상황판 배포

on:
  push:
    branches: [main]
    paths:
      - "forest-front-demo/**"
      - ".github/workflows/deploy-front-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forest-front-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: GitHub Pages 배포
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: forest-front-demo
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forest-front-demo/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 운영 API 주소 확인
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        shell: bash
        run: |
          test -n "$VITE_API_BASE_URL" || {
            echo "::error::GitHub Pages에서 사용할 VITE_API_BASE_URL 저장소 변수가 필요합니다."
            exit 1
          }

      - name: 정적 사이트 빌드
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build -- --base /forest-disaster/

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 배포 산출물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: forest-front-demo/dist

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
