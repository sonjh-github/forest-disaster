name: GCS 어댑터 검증

on:
  push:
    branches: [main]
    paths:
      - "forest-gcs-adapter/**"
      - ".github/workflows/verify-gcs-adapter.yml"
  pull_request:
    paths:
      - "forest-gcs-adapter/**"
      - ".github/workflows/verify-gcs-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: 현장 실행 패키지 생성
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forest-gcs-adapter
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forest-gcs-adapter/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 형식 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      - name: 현장 실행 패키지 업로드
        uses: actions/upload-artifact@v4
        with:
          name: forest-gcs-adapter-${{ github.sha }}
          path: |
            forest-gcs-adapter/dist
            forest-gcs-adapter/package.json
            forest-gcs-adapter/package-lock.json
            forest-gcs-adapter/instance.env.example
            forest-gcs-adapter/scripts
          if-no-files-found: error
          retention-days: 14
