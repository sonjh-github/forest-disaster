name: 연동 검증 서버 배포

on:
  push:
    branches: [main]
    paths:
      - "forest-api-shoot/**"
      - ".github/workflows/deploy-shooter-railway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forest-shooter-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Railway 프로덕션 배포
    runs-on: ubuntu-latest
    environment: shooter-production
    defaults:
      run:
        working-directory: forest-api-shoot
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forest-api-shoot/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 테스트
        run: npm test

      - name: 배포 설정 확인
        shell: bash
        run: |
          test -n "$RAILWAY_TOKEN" || {
            echo "::error::RAILWAY_TOKEN 저장소 시크릿이 필요합니다."
            exit 1
          }
          test -n "${{ secrets.RAILWAY_SHOOTER_SERVICE }}" || {
            echo "::error::RAILWAY_SHOOTER_SERVICE 저장소 시크릿이 필요합니다."
            exit 1
          }

      - name: Railway 배포
        run: npx @railway/cli@5.30.1 up --service "${{ secrets.RAILWAY_SHOOTER_SERVICE }}" --environment production --ci --path-as-root
