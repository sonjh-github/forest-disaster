openapi: 3.1.0
info:
  title: 산림재난 통합 연계 API
  version: 1.1.0
  description: |
    투비유니콘 통합 플랫폼과 장비·통신망·AI 제공업체 사이의 공통 계약입니다.
    외부 업체는 결과 수신 API를 호출하며, 투비유니콘은 등록된 endpointEnv를 통해
    외부 기능을 호출합니다. 이 명세는 외부 장비·RF·AI 자체 구현을 의미하지 않습니다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /assets:
    get:
      summary: 등록 장치 목록 조회
      operationId: listAssets
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        "200": {description: 장치 목록}
    post:
      summary: 장치 자산 사전등록
      description: 현장 데이터 수신 전에 관리자 권한으로 장치를 등록한다. 자동발견 데이터만으로 자산을 생성하지 않는다.
      operationId: registerAsset
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AssetRegistration"}
      responses:
        "201": {description: REGISTERED 상태의 장치 생성}
        "400": {description: 장치 식별자 또는 기능 목록 오류}
  /assets/{assetId}/status:
    post:
      summary: 장치 운용 상태 변경
      operationId: changeAssetStatus
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [REGISTERED, ACTIVE, SUSPENDED, LOST, RETIRED]
                reason: {type: string}
      responses:
        "200": {description: 상태 변경 및 감사기록 완료}
        "404": {description: 장치 없음}
  /assets/{assetId}/credentials:
    get:
      summary: 장치 인증정보 메타데이터 조회
      description: 인증 해시와 원문 secret은 반환하지 않는다.
      operationId: listDeviceCredentials
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200": {description: 발급·만료·폐기·최근 인증 시각 목록}
    post:
      summary: 장치 API 인증정보 발급
      description: 원문 secret은 이 응답에서 한 번만 제공하고 DB에는 해시만 저장한다.
      operationId: issueDeviceCredential
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                credentialType: {type: string, const: API_KEY, default: API_KEY}
                expiresAt: {type: string, format: date-time}
      responses:
        "201": {description: 장치 인증정보 발급}
  /assets/{assetId}/credentials/{credentialId}/revoke:
    post:
      summary: 장치 인증정보 폐기
      operationId: revokeDeviceCredential
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - name: credentialId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: 폐기 완료}
        "404": {description: 인증정보 없음}
  /events/{eventId}/personnel-device-assignments:
    get:
      summary: 사건별 대원-단말 배정 이력 조회
      operationId: listPersonnelDeviceAssignments
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200": {description: 배정 이력}
    post:
      summary: 대원에게 사전등록 단말 배정
      operationId: assignDeviceToPersonnel
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PersonnelDeviceAssignment"}
      responses:
        "201": {description: 배정 완료}
        "409": {description: 대원 또는 단말이 이미 활성 배정됨}
  /events/{eventId}/personnel-device-assignments/{assignmentId}/release:
    post:
      summary: 대원-단말 배정 해제
      operationId: releasePersonnelDeviceAssignment
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: assignmentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [releasedAt]
              properties:
                releasedAt: {type: string, format: date-time}
      responses:
        "200": {description: 배정 해제 완료}
  /devices/activate:
    post:
      summary: 현장 단말 인증 및 활성 배정 확인
      security: []
      operationId: activateDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, credential, eventId, personExternalId]
              properties:
                assetId: {type: string, format: uuid}
                credential: {type: string, writeOnly: true}
                eventId: {type: string, format: uuid}
                personExternalId: {type: string}
      responses:
        "200":
          description: 인증 및 배정 확인 완료, 15분 유효 장치 Bearer 토큰 발급
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      activated: {type: boolean, const: true}
                      assetId: {type: string, format: uuid}
                      assignmentId: {type: string, format: uuid}
                      activatedAt: {type: string, format: date-time}
                      accessToken: {type: string, writeOnly: true}
                      tokenType: {type: string, const: Bearer}
                      expiresIn: {type: integer, const: 900}
        "401": {description: 장치 인증 실패}
        "403": {description: 해당 사건·대원에게 배정되지 않은 장치}
  /integrations:
    get:
      summary: 연계 기능, 소유 업체, 구현 경계 및 준비 상태 조회
      operationId: listIntegrationCapabilities
      responses:
        "200":
          description: 연계 기능 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Capability"}
  /integrations/{capabilityId}/invoke:
    post:
      summary: 등록된 외부 장비 또는 AI API 호출
      description: 동일 capabilityId, direction, requestId 요청은 한 번만 처리합니다.
      operationId: invokeIntegration
      parameters:
        - $ref: "#/components/parameters/CapabilityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IntegrationEnvelope"}
      responses:
        "200": {description: 호출 완료 또는 기존 요청 상태 반환}
        "400": {description: 계약 검증 실패 또는 외부 호출 실패}
        "404": {description: 등록되지 않은 capabilityId}
  /integrations/{capabilityId}/results:
    post:
      summary: 외부 장비 텔레메트리 또는 AI 결과 수신
      operationId: receiveIntegrationResult
      parameters:
        - $ref: "#/components/parameters/CapabilityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IntegrationEnvelope"}
      responses:
        "200": {description: 저장 완료 또는 기존 요청 상태 반환}
        "400": {description: 계약 검증 또는 저장 실패}
        "404": {description: 등록되지 않은 capabilityId}
  /integrations/{capabilityId}/messages/{requestId}:
    get:
      summary: 요청 처리 상태와 오류 조회
      operationId: getIntegrationMessage
      parameters:
        - $ref: "#/components/parameters/CapabilityId"
        - name: requestId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: direction
          in: query
          required: true
          schema: {type: string, enum: [INBOUND, OUTBOUND]}
      responses:
        "200":
          description: 접수·처리·실패 상태
        "404":
          description: 요청 없음
  /events/{eventId}/kpis:
    get:
      summary: 실증 KPI 측정값과 증빙 조회
      operationId: listKpiMeasurements
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200": {description: KPI 목록}
    post:
      summary: 검증된 실증 KPI 측정값 등록
      description: |
        통신망 구축시간, 망 가용성, 영상·메시지 성공률 등 외부 장비에서만 측정 가능한
        값은 해당 소관 업체가 원시 증빙과 함께 전송해야 합니다. 플랫폼은 수집·판정·표시합니다.
      operationId: createKpiMeasurement
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KpiMeasurement"}
      responses:
        "201": {description: KPI 저장 완료}
  /events/{eventId}/personnel-positions:batch:
    post:
      summary: 대원 위치·통신 상태 일괄 수신
      description: |
        GNSS/RTK는 측위 수단이며 Wi-Fi/LTE 등은 차량 통신모듈·현장망에 연결하는
        주 통신이다. LPWA는 주 통신 두절 시 최소 위치·상태를 전달하는 비상 보조망이다.
      operationId: ingestPersonnelPositions
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: {$ref: "#/components/schemas/PersonnelPosition"}
      responses:
        "200": {description: 항목별 저장 또는 거부 결과}
        "400": {description: 측위·통신 규약 검증 실패}
  /events/{eventId}/personnel-positions/latest:
    get:
      summary: 대원별 최신 위치·현재 통신 경로 조회
      operationId: listLatestPersonnelPositions
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 50}
      responses:
        "200": {description: 최신 대원 위치 목록}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CapabilityId:
      name: capabilityId
      in: path
      required: true
      schema: {type: string, minLength: 3, maxLength: 150}
    EventId:
      name: eventId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: context.requestId와 동일한 UUID
      schema: {type: string, format: uuid}
    AssetId:
      name: assetId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    AssetRegistration:
      type: object
      required: [assetCode, assetType, serialNumber, capabilities]
      properties:
        assetId: {type: string, format: uuid}
        assetCode: {type: string, maxLength: 100}
        assetType: {type: string, example: PERSONNEL_TERMINAL}
        assetName: {type: string, maxLength: 200}
        ownerOrgCode: {type: string, maxLength: 100}
        modelName: {type: string, maxLength: 100}
        serialNumber: {type: string, maxLength: 200}
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z][A-Z0-9_]{1,49}$"
    PersonnelDeviceAssignment:
      type: object
      required: [personExternalId, assetId, assignedAt]
      properties:
        personExternalId: {type: string, maxLength: 200}
        assetId: {type: string, format: uuid}
        assignedAt: {type: string, format: date-time}
        assignedBy: {type: string, maxLength: 200}
    Capability:
      type: object
      required: [id, domain, kind, direction, owner, boundary, evidenceStatus]
      properties:
        id: {type: string}
        domain: {type: string, enum: [common, wildfire, landslide]}
        kind: {type: string, enum: [communication, ai]}
        direction: {type: string, enum: [INBOUND, OUTBOUND, BIDIRECTIONAL]}
        owner: {type: string, description: 계획서·연차보고서상 주관 기관}
        boundary:
          type: string
          enum: [TOBE, EXTERNAL]
        evidenceStatus:
          type: string
          enum: [IMPLEMENTED, MOCK, CONTRACT_ONLY]
    IntegrationEnvelope:
      type: object
      required: [context, data]
      properties:
        context:
          type: object
          required: [eventId, requestId, sourceSystem, occurredAt, schemaVersion]
          properties:
            eventId: {type: string, format: uuid}
            requestId: {type: string, format: uuid}
            correlationId: {type: string, format: uuid}
            sourceSystem: {type: string, minLength: 2, maxLength: 100}
            reportedByAssetId:
              type: string
              format: uuid
              description: 통합 API를 실제 호출한 게이트웨이·GCS·NMS 자산 ID. reportingRole과 함께 사용한다.
            reportingRole:
              type: string
              enum: [GATEWAY, GCS, NMS, DEVICE, SERVICE]
              description: 실제 보고 주체의 역할. reportedByAssetId와 함께 사용한다.
            occurredAt: {type: string, format: date-time}
            sentAt: {type: string, format: date-time}
            schemaVersion: {type: string, const: "1.0"}
        data:
          type: object
          additionalProperties: true
    KpiMeasurement:
      type: object
      required:
        [testRunId, metricCode, metricName, measuredFrom, measuredTo, measuredValue, unit, sourceSystem, evidence]
      properties:
        testRunId: {type: string, format: uuid}
        metricCode: {type: string}
        metricName: {type: string}
        measuredFrom: {type: string, format: date-time}
        measuredTo: {type: string, format: date-time}
        numerator: {type: number}
        denominator: {type: number, exclusiveMinimum: 0}
        measuredValue: {type: number}
        unit: {type: string}
        targetOperator: {type: string, enum: [LT, LTE, EQ, GTE, GT]}
        targetValue: {type: number}
        passed: {type: boolean}
        sourceSystem: {type: string}
        evidence:
          type: array
          items:
            type: object
            additionalProperties: true
    PersonnelPosition:
      type: object
      required:
        - personExternalId
        - observedAt
        - transmittedAt
        - geometry
        - positioningMethod
        - primaryLink
        - fallbackLink
        - activeLink
        - fallbackActivated
        - sourceSystem
      properties:
        personExternalId: {type: string, maxLength: 200}
        observedAt: {type: string, format: date-time, description: GNSS 측위 시각}
        transmittedAt: {type: string, format: date-time, description: 단말 송신 시각}
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type: {type: string, const: Point}
            coordinates:
              type: array
              minItems: 2
              maxItems: 3
              items: {type: number}
        horizontalAccuracyM: {type: number, minimum: 0}
        positioningMethod:
          type: string
          enum: [RTK_FIXED, RTK_FLOAT, GNSS]
          description: 위치 산출 방식이며 통신 경로와 독립적
        gnssFixQuality: {type: string}
        primaryLink:
          type: string
          const: LPWA
          description: 연구 문서 기준 기본 LPWA 현장망
        fallbackLink:
          type: string
          const: LTE
          description: LPWA 음영지역에서 사용하는 LTE 보조망
        activeLink:
          type: string
          enum: [LPWA, LTE]
          description: 이 위치·상태 값이 실제 전송된 경로
        fallbackActivated:
          type: boolean
          description: activeLink가 LTE일 때만 true
        lastPrimaryLinkAt: {type: string, format: date-time}
        signalStrengthDbm: {type: number}
        batteryPercent: {type: number, minimum: 0, maximum: 100}
        activityStatus: {type: string}
        safetyStatus: {type: string}
        emergency:
          type: boolean
          description: 대원의 비상 호출 또는 긴급 상태
        sourceAssetId: {type: string, format: uuid}
        sourceSystem: {type: string}
        qualityStatus: {type: string, enum: [RAW, VALIDATED, REJECTED]}
    RtkLpwaGatewayStatus:
      type: object
      required: [assetId, observedAt, operationalStatus, rtcmFormat, rtcmAvailable, deliveryMode, beaconChannel, uplinkChannelCount, connectedTerminals, allocatedSlots, ethernetBackhaul]
      properties:
        assetId: {type: string, format: uuid}
        observedAt: {type: string, format: date-time}
        operationalStatus: {type: string, enum: [ONLINE, DEGRADED, OFFLINE]}
        rtcmFormat: {type: string, example: RTCM3}
        rtcmAvailable: {type: boolean}
        correctionAgeSeconds: {type: number, minimum: 0}
        deliveryMode: {type: string, enum: [BROADCAST, MULTICAST]}
        beaconChannel: {type: integer, minimum: 0}
        uplinkChannelCount: {type: integer, minimum: 0}
        connectedTerminals: {type: integer, minimum: 0}
        allocatedSlots: {type: array, items: {type: object, additionalProperties: true}}
        ethernetBackhaul: {type: object, additionalProperties: true}
        attributes: {type: object, additionalProperties: true}
    TvwsLinkObservation:
      type: object
      required: [baseAssetId, cpeAssetId, observedAt, operationalStatus, ingressMedium, backhaulType, backhaulAvailable, connectedTerminals]
      properties:
        baseAssetId: {type: string, format: uuid}
        cpeAssetId: {type: string, format: uuid}
        observedAt: {type: string, format: date-time}
        operationalStatus: {type: string, enum: [ONLINE, DEGRADED, OFFLINE]}
        channel: {type: string}
        signalStrengthDbm: {type: number}
        throughputMbps: {type: number, minimum: 0}
        latencyMs: {type: number, minimum: 0}
        packetLossPct: {type: number, minimum: 0, maximum: 100}
        distanceM: {type: number, minimum: 0}
        ingressMedium: {type: string, const: ETHERNET}
        backhaulType: {type: string, enum: [TVWS, LTE, 5G, LEO, ETHERNET]}
        backhaulAvailable: {type: boolean}
        connectedTerminals: {type: integer, minimum: 0}
        attributes: {type: object, additionalProperties: true}
